[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-digest"
version = "0.2.0"
authors = [
    { name="Gwendal Minguy-Pèlerin", email="gwendalminguy@outlook.fr" }
]
description = "Technical watch summarization tool."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
license = { file="LICENSE" }
maintainers = [
  { name = "Gwendal Minguy-Pèlerin", email = "gwendalminguy@outlook.fr" }
]
dependencies = [
    "feedparser>=6.0.0,<6.1.0",
    "google-genai>=1.73.0,<1.74.0",
    "python-dotenv>=1.2.0,<1.3.0",
    "requests>=2.33.0,<2.34.0",
    "typer>=0.24.0,<0.25.0"
]
keywords = ["cli", "devtools", "summarization", "feed", "rss", "ai", "productivity"]

[project.scripts]
digest = "digest.cli:app"

[project.urls]
Homepage = "https://github.com/gwendalminguy/tool-digest"
Repository = "https://github.com/gwendalminguy/tool-digest"
Changelog = "https://github.com/gwendalminguy/tool-digest/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
digest = ["instructions.md"]
